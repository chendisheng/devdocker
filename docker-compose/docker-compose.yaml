version: "3.9"

# ╔══════════════════════════════════════════════════════════════╗
#  本地开发环境 · Local Dev Stack
#  ✅ 已启用  → 直接运行的服务
#  💤 注释中  → 取消注释即可启用；记得同步打开底部 volumes 块
#
#  快速启动:      docker compose up -d
#  停止保留数据:  docker compose down
#  停止并删数据:  docker compose down -v
# ╚══════════════════════════════════════════════════════════════╝

networks:
  dev_net:
    driver: bridge

# ── 持久化卷（启用对应服务时一并取消注释）────────────────────
volumes:
  mysql_data:
  redis_data:
  # postgres_data:
  # mariadb_data:
  # mongo_data:
  # rabbitmq_data:
  # kafka_data:
  # zookeeper_data:
  # es_data:
  # kibana_data:
  # meilisearch_data:
  # minio_data:
  # seaweedfs_data:
  # prometheus_data:
  # grafana_data:
  # jaeger_data:
  # zipkin_data:
  # keycloak_data:
  # vault_data:
  # consul_data:
  # localstack_data:
  # wiremock_data:

# ══════════════════════════════════════════════════════════════
services:

# ┌──────────────────────────────────────────────────────────┐
#  § 1  数据库
# └──────────────────────────────────────────────────────────┘

  # ── ✅ MySQL 8 ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: local_mysql
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dev_db
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./docker/mysql/init:/docker-entrypoint-initdb.d    # 初始化 SQL（可选）
      #- ./docker/mysql/conf.d:/etc/mysql/conf.d            # 自定义配置（可选）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── ✅ Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis123
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

