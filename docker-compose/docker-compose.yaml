# ╔══════════════════════════════════════════════════════════════╗
#  本地开发环境 · Local Dev Stack
#  ✅ 已启用  → 直接运行的服务
#  💤 注释中  → 取消注释即可启用；记得同步打开底部 volumes 块
#
#  快速启动:      docker compose up -d
#  停止保留数据:  docker compose down
#  停止并删数据:  docker compose down -v
# ╚══════════════════════════════════════════════════════════════╝

networks:
  dev_net:
    driver: bridge

# ── 持久化卷（启用对应服务时一并取消注释）────────────────────
volumes:
  mysql_data:
  redis_data:
  redis_cluster_data:
  kafka_data:

# ══════════════════════════════════════════════════════════════
services:

  # ── ✅ MySQL 8 ─────────────────────────────────────────────
  mysql:
    image: mysql:9.6.0
    container_name: local_mysql
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: dev_db
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./docker/mysql/init:/docker-entrypoint-initdb.d    # 初始化 SQL（可选）
      #- ./docker/mysql/conf.d:/etc/mysql/conf.d            # 自定义配置（可选）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── ✅ Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 🧩 Redis Cluster 3 节点（本地模拟服务器 Redis 集群）────────────
  # 启动方式:
  #   docker compose --profile redis-cluster up -d redis-cluster
  #
  # 给宿主机上的 Go 服务使用:
  #   cluster_addrs: ["127.0.0.1:7100", "127.0.0.1:7101", "127.0.0.1:7102"]
  #
  # 注意: 这是单容器多 Redis 进程，专门用于本机调试 Redis Cluster 路由、
  # MOVED 重定向和 PubSub/stream 在集群模式下的行为。
  redis-cluster:
    image: redis:7-alpine
    container_name: local_redis_cluster
    restart: unless-stopped
    profiles:
      - redis-cluster
    networks:
      - dev_net
    ports:
      - "7100:7100"
      - "7101:7101"
      - "7102:7102"
      - "17100:17100"
      - "17101:17101"
      - "17102:17102"
    command: |
      sh -c '
        set -eu

        for port in 7100 7101 7102; do
          mkdir -p /data/$${port}
          printf "%s\n" \
            "port $${port}" \
            "bind 0.0.0.0" \
            "protected-mode no" \
            "appendonly yes" \
            "dir /data/$${port}" \
            "cluster-enabled yes" \
            "cluster-config-file nodes.conf" \
            "cluster-node-timeout 5000" \
            "cluster-announce-ip 127.0.0.1" \
            "cluster-announce-port $${port}" \
            "cluster-announce-bus-port 1$${port}" \
            > /data/$${port}/redis.conf
          redis-server /data/$${port}/redis.conf &
        done

        sleep 3
        if ! redis-cli -p 7100 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
          yes yes | redis-cli --cluster create \
            127.0.0.1:7100 \
            127.0.0.1:7101 \
            127.0.0.1:7102 \
            --cluster-replicas 0
        fi

        wait
      '
    volumes:
      - redis_cluster_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7100", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── ✅ Kafka（KRaft 模式，无需 Zookeeper）─────────────────
  # 高吞吐事件流；KRaft 模式本地更轻量
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    networks:
      - dev_net

    ports:
      - "9092:9092"

    environment:

      # =========================
      # KRaft 基础配置
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # =========================
      # listeners（容器内部监听）
      # =========================
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # =========================
      # ⭐关键：对外访问地址（宿主机 / 内网机器用）
      # =========================
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.33:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # =========================
      # 存储
      # =========================
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # =========================
      # 单节点必须
      # =========================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # =========================
      # 开发模式
      # =========================
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── ✅ Kafka UI（Kafka 管理客户端）──────────────────────────
  # Web UI: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local_kafka_ui
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
