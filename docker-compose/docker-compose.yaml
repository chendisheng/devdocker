# ╔══════════════════════════════════════════════════════════════╗
#  本地开发环境 · Local Dev Stack
#  ✅ 已启用  → 直接运行的服务
#  💤 注释中  → 取消注释即可启用；记得同步打开底部 volumes 块
#
#  快速启动:      docker compose up -d
#  停止保留数据:  docker compose down
#  停止并删数据:  docker compose down -v
# ╚══════════════════════════════════════════════════════════════╝

networks:
  dev_net:
    driver: bridge

# ── 持久化卷（启用对应服务时一并取消注释）────────────────────
volumes:
  mysql_data:
  redis_data:
  kafka_data:

# ══════════════════════════════════════════════════════════════
services:

  # ── ✅ MySQL 8 ─────────────────────────────────────────────
  mysql:
    image: mysql:9.6.0
    container_name: local_mysql
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: dev_db
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./docker/mysql/init:/docker-entrypoint-initdb.d    # 初始化 SQL（可选）
      #- ./docker/mysql/conf.d:/etc/mysql/conf.d            # 自定义配置（可选）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── ✅ Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ✅ Kafka（KRaft 模式，无需 Zookeeper）─────────────────
  # 高吞吐事件流；KRaft 模式本地更轻量
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    networks:
      - dev_net

    ports:
      - "9092:9092"

    environment:

      # =========================
      # KRaft 基础配置
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # =========================
      # listeners（容器内部监听）
      # =========================
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # =========================
      # ⭐关键：对外访问地址（宿主机 / 内网机器用）
      # =========================
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.3:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # =========================
      # 存储
      # =========================
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # =========================
      # 单节点必须
      # =========================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # =========================
      # 开发模式
      # =========================
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── ✅ Kafka UI（Kafka 管理客户端）──────────────────────────
  # Web UI: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local_kafka_ui
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka