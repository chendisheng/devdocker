version: "3.9"

# ╔══════════════════════════════════════════════════════════════╗
#  本地开发环境 · Local Dev Stack
#  ✅ 已启用  → 直接运行的服务
#  💤 注释中  → 取消注释即可启用；记得同步打开底部 volumes 块
#
#  快速启动:      docker compose up -d
#  停止保留数据:  docker compose down
#  停止并删数据:  docker compose down -v
# ╚══════════════════════════════════════════════════════════════╝

networks:
  dev_net:
    driver: bridge

# ── 持久化卷（启用对应服务时一并取消注释）────────────────────
volumes:
  mysql_data:
  redis_data:
  kafka_data:

# ══════════════════════════════════════════════════════════════
services:

  # ── ✅ MySQL 8 ─────────────────────────────────────────────
  mysql:
    image: mysql:9.6.0
    container_name: local_mysql
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dev_db
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./docker/mysql/init:/docker-entrypoint-initdb.d    # 初始化 SQL（可选）
      #- ./docker/mysql/conf.d:/etc/mysql/conf.d            # 自定义配置（可选）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── ✅ Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis123
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ✅ Kafka（KRaft 模式，无需 Zookeeper）─────────────────
  # 高吞吐事件流；KRaft 模式本地更轻量
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: local_kafka
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SSL://kafka:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SSL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # SSL 配置
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.server.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafkassl
      KAFKA_SSL_KEY_CREDENTIALS: kafkassl
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.server.truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafkassl
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.2,TLSv1.3
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka/certs:/etc/kafka/secrets

  # ── ✅ Kafka UI（Kafka 管理客户端）──────────────────────────
  # Web UI: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local_kafka_ui
    restart: unless-stopped
    networks:
      - dev_net
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka